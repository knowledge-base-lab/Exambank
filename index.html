<title>Exam Bank 第二階段（測試版）</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: one-column phone app (max 560px), fixed bottom dock for tabs / quiz actions. */
:root{
  --bg:#F2F4F6; --surface:#FFFFFF; --ink:#16212B; --muted:#5A6774; --line:#DCE2E8;
  --accent:#3F67C7; --on-accent:#FFFFFF; --accent-ink:#2C4FA3; --accent-soft:#E3ECFB;
  --good:#1B7F52; --good-bg:#E2F4E9; --bad:#B83232; --bad-bg:#FBE5E5;
  --sans:'Noto Sans TC',system-ui,-apple-system,'PingFang TC','Microsoft JhengHei',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1418; --surface:#18202A; --ink:#E8EDF1; --muted:#9AA7B3; --line:#2A3540;
    --accent:#7FA2F0; --on-accent:#0B1630; --accent-ink:#A9C1F7; --accent-soft:#1B2A4A;
    --good:#4CC38A; --good-bg:#12301F; --bad:#F07474; --bad-bg:#3A1717; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1418; --surface:#18202A; --ink:#E8EDF1; --muted:#9AA7B3; --line:#2A3540;
  --accent:#7FA2F0; --on-accent:#0B1630; --accent-ink:#A9C1F7; --accent-soft:#1B2A4A;
  --good:#4CC38A; --good-bg:#12301F; --bad:#F07474; --bad-bg:#3A1717; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:400 16px/1.65 var(--sans);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent-ink);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding-block:20px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.stack{display:flex;flex-direction:column;gap:20px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-size:28px;line-height:1.2;font-weight:700;letter-spacing:.01em}
h2{font-size:13px;font-weight:700;letter-spacing:.12em;color:var(--muted)}
.sub{color:var(--muted);font-size:14px;margin:4px 0 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.band{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border:1px solid var(--line);border-radius:14px}
.band div{padding:12px 4px;text-align:center;min-width:0}
.band div+div{border-left:1px solid var(--line)}
.band b{display:block;font:500 20px/1.2 var(--mono)}
.band span{font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.chip small{font-family:var(--mono);color:var(--muted);margin-left:4px}
.btn{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:56px;padding:0 18px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:500;text-align:left}
.btn small{color:var(--muted);font:400 13px var(--mono)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.btn.primary small{color:var(--on-accent);opacity:.75}
.btn:disabled{opacity:.45;cursor:default}
.btn.warn{border-color:var(--bad);color:var(--bad)}
.btn.sm{min-height:44px;width:auto;justify-content:center;padding:0 16px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.seg button{flex:1;min-height:44px;padding:0 6px;font-size:14px}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:var(--on-accent);font-weight:700}
.setrow{display:flex;flex-direction:column;gap:6px}
.setrow label,.lbl{font-size:13px;color:var(--muted)}
.note{background:var(--accent-soft);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:14px}
.note button{color:var(--accent-ink);font-weight:700;text-decoration:underline;padding:0}
.qtop{display:flex;align-items:center;gap:12px}
.qtop .x{min-width:44px;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:18px}
.qtop .cnt{font:500 15px var(--mono)}
.qtop .clock{margin-left:auto;font:500 15px var(--mono);color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--accent)}
.tag{display:inline-block;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 8px;margin:0 6px 8px 0}
.tag.warn{color:var(--accent-ink);border-color:var(--accent)}
.tag.bad{color:var(--bad);border-color:var(--bad);font-weight:500}
.qimgs{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.qimg{display:block;width:100%;padding:6px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:zoom-in;font:inherit;color:#555;text-align:center}
.qimg img{display:block;max-width:100%;height:auto;margin:0 auto}
.qimg.bad{cursor:default;background:var(--bad-bg);color:var(--bad);padding:10px;font-size:14px}
#imgv{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.95);display:flex;flex-direction:column;color:#fff}
#imgv .ivbar{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top))}
#imgv button{min-height:44px;padding:0 16px;border-radius:12px;border:1px solid #8a8a8a;background:#222;color:#fff;font-size:16px;font-family:inherit}
#ivstage{flex:1;position:relative;overflow:hidden;touch-action:none;display:flex;align-items:center;justify-content:center}
#ivimg{max-width:100%;max-height:100%;transform-origin:center center;user-select:none;-webkit-user-select:none;background:#fff;border-radius:4px;will-change:transform}
#imgv .ivfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;padding-bottom:max(10px,env(safe-area-inset-bottom));font-size:13px;color:#cfcfcf}
.qtext{font-size:18px;line-height:1.7;font-weight:500;margin:0}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:start;width:100%;min-height:56px;padding:12px 14px;text-align:left;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)}
.opt .ltr{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font:500 14px var(--mono)}
.opt .otxt{padding-top:3px;min-width:0;overflow-wrap:anywhere}
.opt.picked{border-color:var(--accent);background:var(--accent-soft)}
.opt.picked .ltr{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.opt.good{border-color:var(--good);background:var(--good-bg)}
.opt.good .ltr{background:var(--good);border-color:var(--good);color:var(--surface)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt.bad .ltr{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt:disabled{opacity:1;cursor:default}
.exp{border-radius:12px;background:var(--surface);border:1px solid var(--line);padding:12px 14px;font-size:15px}
.exp b{display:block;font-size:12px;letter-spacing:.12em;color:var(--muted);margin-bottom:2px}
.verdict{font-weight:700;margin:0}
.verdict.good{color:var(--good)} .verdict.bad{color:var(--bad)}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.dockin{max-width:560px;margin:0 auto;display:flex;gap:10px;padding:10px 0}
.dock.tabs{padding-left:0;padding-right:0}
.dock.tabs .dockin{padding:0;gap:0}
.tab{position:relative;flex:1;min-height:58px;font-size:15px;color:var(--muted)}
.tab.on{color:var(--ink);font-weight:700}
.tab.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.dot{font:500 11px var(--mono);font-style:normal;background:var(--bad);color:var(--surface);border-radius:999px;padding:1px 6px;margin-left:6px}
.dock .btn{justify-content:center}
.score{font:500 56px/1.1 var(--mono);margin:0}
.score small{font-size:24px;color:var(--muted)}
.miss{display:flex;flex-direction:column;gap:8px}
.miss p{margin:0}
.ans{font-size:15px}
.ans .g{color:var(--good);font-weight:500} .ans .r{color:var(--bad);font-weight:500}
textarea{width:100%;min-height:170px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:400 15px/1.6 var(--sans);resize:vertical}
pre{margin:0;padding:12px;background:var(--bg);border:1px solid var(--line);border-radius:10px;font:400 13px/1.6 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere}
details summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:500}
.qlist{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:14px}
.qlist li{display:grid;grid-template-columns:32px 1fr;gap:6px}
.qlist .n{font-family:var(--mono);color:var(--muted)}
.qlist span+span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.msg{font-size:14px;margin:0}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.vh:focus-visible+label{outline:2px solid var(--accent-ink);outline-offset:2px}
.empty{text-align:center;color:var(--muted);padding:32px 12px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:9;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;max-width:90vw}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .25s}}
.orow{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:center}
.orow b{text-align:center;color:var(--muted)}
input[type=text]{width:100%;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:400 15px/1.5 var(--sans)}
input[type=text]:focus-visible,input[type=checkbox]:focus-visible{outline:2px solid var(--accent-ink);outline-offset:2px}
.esband{display:grid;grid-template-columns:1fr 1fr;gap:8px}.esband div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center;min-width:0}.esband b{display:block;font:500 22px/1.2 var(--mono)}.esband span{font-size:13px;color:var(--muted)}
.chk{display:flex;align-items:center;gap:10px;min-height:44px;font-size:15px}
.chk input{width:22px;height:22px;flex:none;accent-color:var(--accent)}
.pq.off{opacity:.62}
.pre{white-space:pre-wrap;overflow-wrap:anywhere}
select{width:100%;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:400 15px/1.5 var(--sans)}
select:focus-visible{outline:2px solid var(--accent-ink);outline-offset:2px}
.etitle{font:600 18px/1.4 var(--sans)}
.note.alert{background:var(--bad-bg);border:1px solid var(--bad)}
.note.alert button{color:var(--bad)}
.tag.bad{background:var(--bad-bg)}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pills.four{display:grid;grid-template-columns:1fr 1fr}
.pill{min-height:46px;padding:8px 14px;border-radius:999px;border:1px solid transparent;background:var(--bg);font-size:15px;font-weight:500;text-align:center}
.pill.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.pill.bad.on{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.fl{display:block;font-size:15px;font-weight:700;color:var(--ink)}
.setrow label.fl{font-size:15px;color:var(--ink)}
.hmcard select{min-height:48px;border-radius:12px;font-size:16px}
#guard:not(:empty){margin-bottom:12px}
.band.two{grid-template-columns:repeat(2,1fr)}
</style>
<style id="mobile-ui">
/* 手機優化（僅 CSS 覆寫；桌面 >600px 維持原樣） */
@media (max-width:600px){
 .app{padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-bottom:calc(130px + env(safe-area-inset-bottom,0px))}
 .dock{padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}

 .tag,.band span,.exp b,.setrow label,.lbl,.esband span,.btn small{font-size:13px}
 .chip,.seg button,.pill,.tab{font-size:15px}
 .chip,.btn.sm,.seg button,.chk,.pill,details summary,.qtop .x{min-height:48px}
 .qtop .x{min-width:48px}

 textarea,input[type=text],select,.hmcard select{font-size:16px}
 input[type=text],select{min-height:48px}
 .toast{font-size:15px;bottom:calc(92px + env(safe-area-inset-bottom,0px));max-width:calc(100vw - 28px)}
 .qlist li{grid-template-columns:36px 1fr}

}

<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
var L='ABCDEFGH', KEY='examBank.v1';
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
var LS={get:function(k){try{return localStorage.getItem(k)}catch(e){return null}},set:function(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}};

/* ---------- 申論題匯入（獨立於「備份與還原」；不呼叫 essayRestore）----------
   只新增題目到 S.essays；不改選擇題、作答(eans)、自評(emark)、考卷(exams)、統計。
   復原用的獨立儲存區 examBank.esimp.v1（不進完整備份，也不使用共用的「還原前快照」）：
   {ver:1, st:'pending'|'done'|'failed', at, label, pre:[匯入前的申論題原始資料]|null, added:[新增的 id…]} */
var ESKEY='examBank.esimp.v1',esI=null;
function esiRec(){
  var r=LS.get(ESKEY);if(r==null)return null;
  try{var o=JSON.parse(r);return (isObj(o)&&o.ver===1&&typeof o.st==='string'&&Array.isArray(o.added))?o:null}catch(e){return null}
}
function esiPut(o){var s=JSON.stringify(o);return LS.set(ESKEY,s)&&LS.get(ESKEY)===s}
function esiDrop(){try{localStorage.removeItem(ESKEY)}catch(e){}return LS.get(ESKEY)==null}
function esiTxt(s,n){s=String(s==null?'':s).replace(/\s+/g,' ').trim();return s.length>n?s.slice(0,n)+'…':s}
function esiNorm(o){
  var r=Object.assign({},o);
  function blank(k){return r[k]==null||String(r[k]).trim()===''}
  if(blank('q')&&o.question!=null)r.q=o.question;
  if(blank('ans')&&o.answer!=null)r.ans=o.answer;
  if(blank('exp')&&o.explanation!=null)r.exp=o.explanation;
  if(blank('cat')&&o.category!=null)r.cat=o.category;
  ['q','ans','exp','year','src','cat'].forEach(function(k){r[k]=(r[k]==null)?'':String(r[k])});
  r.no=(r.no==null)?'':String(r.no);
  r.pend=(o.pend===undefined)?!r.ans.trim():!!o.pend;
  r.id=r.id?String(r.id):'es-'+hash(r.src+'#'+r.no+'#'+r.q);
  return r;
}
function esiCat(e){return nrm(e.cat)+'|'+String(e.no==null?'':e.no).trim()}
function esiKey(e){return esiCat(e)+'|'+nrm(e.q)}
/* 格式辨識：回傳 {arr,fmt} 或 {err} */
function esiDetect(j){
  var arr,fmt;
  if(Array.isArray(j)){
    arr=j;fmt='純清單';
    var mc=arr.filter(function(x){return isObj(x)&&Array.isArray(x.opts||x.options||x.choices)}).length;
    if(arr.length&&mc*2>arr.length)return {err:'這份檔案有「選項」欄位，看起來是選擇題，不是申論題。請到「題庫」頁匯入。申論題沒有改變。'};
  }else if(isObj(j)){
    if(j.format==='exam-bank-backup')return {err:'這是完整備份，不是申論題檔。完整備份請到「題庫」頁的「備份與還原」處理。申論題沒有改變。'};
    if(j.format==='exam-bank-images')return {err:'這是圖片包，不是申論題檔。圖片包請到「題庫」頁的「圖片（附圖）」匯入。申論題沒有改變。'};
    if(Array.isArray(j.essays)){arr=j.essays;fmt=j.format==='exam-bank-essays'?'原始格式（exam-bank-essays）':'含 essays 清單'}
    else return {err:'找不到申論題清單（需要是題目清單，或含 essays 清單的檔案）。申論題沒有改變。'};
  }else return {err:'內容不是題目清單。申論題沒有改變。'};
  if(!arr.length)return {err:'檔案裡沒有題目（0 題）。申論題沒有改變。'};
  return {arr:arr,fmt:fmt,extra:isObj(j)&&(j.answers||j.marks||j.exams)?true:false};
}
/* 比對現有題庫，分類每一題；picks 為「需確認」題的勾選 */
function esiPlan(arr,picks){
  var E=S.essays||[],byKey={},byCat={},qset={},taken={};
  E.forEach(function(e){
    taken[e.id]=1;byKey[esiKey(e)]=1;qset[nrm(e.q)]=1;
    var c=esiCat(e);if(String(e.no==null?'':e.no).trim()!==''){(byCat[c]=byCat[c]||[]).push(e.q)}
  });
  var items=[],seen={},sim=0;
  arr.forEach(function(raw,i){
    var it={i:i,st:'new',why:[],warn:[]};items.push(it);
    if(!isObj(raw)){it.st='err';it.why.push('不是題目物件');return}
    var r=esiNorm(raw);
    if(!String(r.q).trim()){it.st='err';it.why.push('缺少題目文字');return}
    it.r=r;
    if(!r.cat.trim())it.warn.push('缺少考卷分類（會歸入「未歸屬考卷」，不會自動推測）');
    if(!r.no.trim())it.warn.push('缺少題號');
    if(!r.ans.trim())it.warn.push('沒有參考答案（會標為答案待確認）');
    var k=esiKey(r);
    if(byKey[k]){it.st='dup';it.why.push(seen[k]?'檔案內重複（考卷、題號、題幹相同）':'已有相同考卷、題號、題幹的題目');return}
    var c=esiCat(r);
    if(r.no.trim()!==''&&byCat[c]&&byCat[c].length){it.st='confirm';it.why.push('同考卷同題號，但題幹不同');it.cur=byCat[c][0];it.picked=!!(picks&&picks[i])}
    else if(qset[nrm(r.q)])sim++;
    byKey[k]=1;seen[k]=1;qset[nrm(r.q)]=1;
    if(r.no.trim()!==''){(byCat[c]=byCat[c]||[]).push(r.q)}
  });
  var n={read:arr.length,add:0,dup:0,err:0,confirm:0,pick:0,warn:0,sim:sim};
  items.forEach(function(it){
    if(it.st==='err')n.err++;else if(it.st==='dup')n.dup++;
    else{if(it.st==='confirm'){n.confirm++;if(it.picked)n.pick++}if(it.st==='new'||it.picked)n.add++}
    if(it.st!=='err'&&it.warn.length)n.warn++;
  });
  return {items:items,n:n};
}
/* 指派不衝突的 id；已被使用的 id（含檔案自帶的 id）一律改寫，既有題目的 id、圖片連結不動 */
function esiBuild(plan){
  var taken={};(S.essays||[]).forEach(function(e){taken[e.id]=1});
  var out=[],ids=[],changed=0;
  plan.items.forEach(function(it){
    if(!(it.st==='new'||(it.st==='confirm'&&it.picked)))return;
    var r=Object.assign({},it.r),id=r.id;
    if(taken[id]){
      var base='es-'+hash(r.cat+'#'+r.src+'#'+r.no+'#'+r.q),n=1;id=base;
      while(taken[id]){n++;id=base+'-'+n}
      changed++;
    }
    r.id=id;taken[id]=1;out.push(r);ids.push(id);
  });
  return {recs:out,ids:ids,changed:changed};
}
function esiClone(x){return JSON.parse(JSON.stringify(x))}
function esiStrip(raw){try{var o=JSON.parse(raw);delete o.essays;return JSON.stringify(o)}catch(e){return null}}
function esiSaveVerify(){
  var ok=save();if(!ok)return false;
  return LS.get(KEY)===JSON.stringify(S);
}
/* ---- 匯入 ---- */
function esiParse(text,label){
  text=String(text||'').trim();
  if(!text){esI=Object.assign(esI||{},{open:true,stage:'pick',err:'沒有內容。請選擇 JSON 檔案，或貼上 JSON 文字。'});render();return}
  var j;try{j=JSON.parse(text)}catch(e){esI=Object.assign(esI||{},{open:true,stage:'pick',err:'JSON 格式錯誤（可能複製不完整）：'+e.message+'。申論題沒有改變。'});render();return}
  var d=esiDetect(j);
  if(d.err){esI=Object.assign(esI||{},{open:true,stage:'pick',err:d.err});render();return}
  esI={open:true,stage:'preview',name:label,fmt:d.fmt,arr:d.arr,extra:d.extra,picks:{},all:{},err:'',paste:(esI&&esI.paste)||''};
  render();window.scrollTo(0,0);
}
function esiRun(){
  var I=esI;if(!I||I.stage!=='preview')return;
  if(loadErr){I.err='主資料讀取失敗，為了保護資料，不能匯入。';render();return}
  var plan=esiPlan(I.arr,I.picks),b=esiBuild(plan);
  if(!b.recs.length){I.err='沒有可以匯入的題目。';render();return}
  var E0=S.essays||[],preJSON=JSON.stringify(E0),pre=JSON.parse(preJSON),preRaw=LS.get(KEY);
  var rec={ver:1,st:'pending',at:Date.now(),label:I.name||'',pre:pre,added:b.ids};
  if(!esiPut(rec)){esiDrop();I.err='無法保存匯入前的申論題原始資料（儲存空間可能不足）。尚未改動任何資料。';render();return}
  S.essays=E0.concat(b.recs);
  var ok=esiSaveVerify(),raw=LS.get(KEY),good=ok;
  if(good){
    try{
      var o=JSON.parse(raw);
      good=Array.isArray(o.essays)&&o.essays.length===pre.length+b.recs.length
        &&JSON.stringify(o.essays.slice(0,pre.length))===preJSON
        &&JSON.stringify(o.essays.slice(pre.length).map(function(e){return e.id}))===JSON.stringify(b.ids)
        &&(preRaw==null||esiStrip(preRaw)===esiStrip(raw));
    }catch(e){good=false}
  }
  if(!good){
    /* 回復：先用匯入前的完整原文，再退一步用保存的申論題原始資料 */
    S.essays=JSON.parse(preJSON);
    var rb=false,cur=LS.get(KEY);
    try{
      if(preRaw!=null?cur===preRaw:cur==null)rb=true;           /* 根本沒寫進去，原文還在 */
      else if(preRaw!=null){rb=LS.set(KEY,preRaw)&&LS.get(KEY)===preRaw}
      else{localStorage.removeItem(KEY);rb=LS.get(KEY)==null}
    }catch(e){rb=false}
    if(rb){esiDrop();esI=null;esiMsg('匯入失敗，已回復到匯入前（申論題 '+pre.length+' 題），沒有新增任何題目。')}
    else{
      rec.st='failed';esiPut(rec);
      esI=null;esiMsg('匯入失敗，而且自動回復也沒有成功。匯入前的申論題原始資料（'+pre.length+' 題）仍保存著，請在下方按「回復到匯入前」。在回復之前，請不要新增或編輯申論題。');
    }
    render();return;
  }
  var done={ver:1,st:'done',at:Date.now(),label:I.name||'',pre:null,added:b.ids,n:{add:b.recs.length}};
  var fin=esiPut(done);
  var cnt=plan.n;
  esfY='';esfS='';esEx='';esQ='';esShow=200;
  I.stage='done';I.rep={add:b.recs.length,dup:cnt.dup,err:cnt.err,skipConfirm:cnt.confirm-cnt.pick,changed:b.changed,total:S.essays.length,fin:fin};
  render();window.scrollTo(0,0);
}

/* ---- 復原本次匯入 ---- */
function esiUndo(){
  var rec=esiRec();if(!rec||rec.st!=='done')return;
  var set={};rec.added.forEach(function(id){set[id]=1});
  var E=S.essays||[],here=E.filter(function(e){return set[e.id]});
  if(!here.length){esiDrop();esiMsg('找不到本次匯入的題目（可能已刪除或還原過其他備份），已清除這筆復原紀錄。');render();return}
  var ans=0,mk=0,img=0;
  here.forEach(function(e){
    if(S.eans&&S.eans[e.id])ans++;
    if(S.emark&&S.emark[e.id])mk++;
    var l=IM&&IM.links&&IM.links[e.id];if(l&&((l.q&&l.q.length)||(l.a&&l.a.length)))img++;
  });
  if(ans||mk||img){
    esiMsg('不能復原：本次新增的題目中，'+[ans?ans+' 題已有作答紀錄':'',mk?mk+' 題已有自評紀錄':'',img?img+' 題已附圖片':''].filter(Boolean).join('、')+'。為了不弄丟這些資料，已拒絕復原，沒有改動任何資料。可以逐題刪除不要的題目。');render();return;
  }
  if(loadErr){esiMsg('主資料讀取失敗，不能復原。');render();return}
  var before=S.essays,beforeRaw=LS.get(KEY);
  S.essays=E.filter(function(e){return !set[e.id]});
  var ok=esiSaveVerify(),good=ok;
  if(good){try{good=JSON.stringify(JSON.parse(LS.get(KEY)).essays)===JSON.stringify(S.essays)&&(beforeRaw==null||esiStrip(beforeRaw)===esiStrip(LS.get(KEY)))}catch(e){good=false}}
  if(!good){
    S.essays=before;var rb=false;
    try{
      if(beforeRaw==null||LS.get(KEY)===beforeRaw)rb=true;
      else rb=LS.set(KEY,beforeRaw)&&LS.get(KEY)===beforeRaw;
    }catch(e){rb=false}
    esiMsg(rb?'復原失敗，資料已維持在復原前的狀態，沒有任何題目被移除。':'復原失敗，而且無法確認資料狀態。請不要繼續操作，立刻到「題庫」頁複製完整備份保存，再重新整理頁面確認申論題數量。');
    render();return;
  }
  esiDrop();esiMsg('已復原本次匯入，移除 '+here.length+' 題。其他資料沒有改變。');render();
}
/* ---- 未完成的匯入：回復到匯入前 ---- */
function esiRecover(){
  var rec=esiRec();if(!rec||!Array.isArray(rec.pre))return;

  var before=S.essays;
  S.essays=JSON.parse(JSON.stringify(rec.pre));
  var ok=esiSaveVerify();
  if(!ok){S.essays=before;esiMsg('回復失敗，原始資料仍保存著。請稍後再試，或先釋放瀏覽器儲存空間。');render();return}
  esiDrop();esiMsg('已回復到匯入前（申論題 '+rec.pre.length+' 題）。');render();
}

function imPlan(pack){
  var bank=S.bank||[],ess=S.essays||[],byCatB={},byCatE={};

function check(o){

  if(opts.length>8)return {err:'選項超過 8 個'};
  if(opts.some(function(x){return !x}))return {err:'選項含空白項目'};
  var a=o.ans!=null?o.ans:o.answer;

  var idx=ansIndex(a,opts);
  if(!(idx>=0&&idx<opts.length))return {err:'答案無法對應選項'};
  return {ok:{id:hash(q),uid:(o.id!=null&&String(o.id).trim())?String(o.id).trim():'',q:q,opts:opts,ans:idx,exp:String(o.exp||o.explanation||'').trim(),cat:String(o.cat||o.category||'').trim(),src:String(o.src||'').trim()}};

      else if((m=line.match(/^(?:CAT|分類|類別)\s*[:：]\s*(.*)$/i))){o.cat=m[1];last=null}
      else if((m=line.match(/^\(?([A-Ha-h])[)）.、:：]\s*(.*)$/))){o.opts.push(m[2]);last='opt'}

  });

}

/* ---- 同步 SHA-256（備份完整性檢查；不依賴 crypto.subtle，才能在點擊當下複製）---- */
function sha256(str){
  var P=[],c,d,pr;for(c=2;P.length<64;c++){pr=true;for(d=2;d*d<=c;d++)if(c%d===0){pr=false;break}if(pr)P.push(c)}
  var K=P.map(function(p){return (Math.cbrt(p)%1)*4294967296|0});
  var H=P.slice(0,8).map(function(p){return (Math.sqrt(p)%1)*4294967296|0});
  function rr(v,a){return (v>>>a)|(v<<(32-a))}
  var bytes=new TextEncoder().encode(str),len=bytes.length,total=((len+9+63)>>6)<<6;
  var buf=new Uint8Array(total);buf.set(bytes);buf[len]=0x80;
  var dv=new DataView(buf.buffer);dv.setUint32(total-8,Math.floor(len*8/4294967296));dv.setUint32(total-4,(len*8)>>>0);
  var w=new Array(64),off,t,a,b,cc,dd,e,f,g,h,s0,s1,t1,t2;
  for(off=0;off<total;off+=64){
    for(t=0;t<16;t++)w[t]=dv.getUint32(off+t*4);
    for(t=16;t<64;t++){s0=rr(w[t-15],7)^rr(w[t-15],18)^(w[t-15]>>>3);s1=rr(w[t-2],17)^rr(w[t-2],19)^(w[t-2]>>>10);w[t]=(w[t-16]+s0+w[t-7]+s1)|0}
    a=H[0];b=H[1];cc=H[2];dd=H[3];e=H[4];f=H[5];g=H[6];h=H[7];
    for(t=0;t<64;t++){
      t1=(h+(rr(e,6)^rr(e,11)^rr(e,25))+((e&f)^(~e&g))+K[t]+w[t])|0;
      t2=((rr(a,2)^rr(a,13)^rr(a,22))+((a&b)^(a&cc)^(b&cc)))|0;
      h=g;g=f;f=e;e=(dd+t1)|0;dd=cc;cc=b;b=a;a=(t1+t2)|0;
    }
    H[0]=(H[0]+a)|0;H[1]=(H[1]+b)|0;H[2]=(H[2]+cc)|0;H[3]=(H[3]+dd)|0;H[4]=(H[4]+e)|0;H[5]=(H[5]+f)|0;H[6]=(H[6]+g)|0;H[7]=(H[7]+h)|0;
  }
  return H.map(function(v){return ('00000000'+(v>>>0).toString(16)).slice(-8)}).join('');
}

/* ---- 套用還原：所有儲存區都寫入並讀回驗證才算成功，任一失敗全部回復 ---- */
function applyRestore(pv,skipSnap){
  var bk=pv.bk,keys=Object.keys(bk.stores);
  var hadErr=!!loadErr;
  if(!skipSnap){
    var okSave=hadErr?writeRescue(rawBad):writeSnap(buildBackup(),'還原前');
    if(!okSave){
      bkNeedForce=true;bkMsg='無法留下'+(hadErr?'損壞資料的救援副本':'還原前快照')+'（儲存空間不足）。尚未改動任何資料。請先'+(hadErr?'按警告上的「複製原始資料」':'按「複製完整備份」')+'存到備忘錄，再選擇「已自行備份，仍要還原」。';
      render();return;
    }
  }
  var prev={},written=[],failed='';
  keys.forEach(function(k){prev[k]=LS.get(k)});
  try{
    keys.forEach(function(k){
      if(!LS.set(k,bk.stores[k]))throw new Error('寫入「'+k+'」失敗');
      written.push(k);
    });
    keys.forEach(function(k){
      var back=LS.get(k);
      if(back!==bk.stores[k]||sha256(back)!==sha256(bk.stores[k]))throw new Error('讀回「'+k+'」時內容不符');
    });
  }catch(e){
    failed=e.message;
    var rbBad=[];
    keys.forEach(function(k){
      try{
        if(LS.get(k)===prev[k])return;
        if(prev[k]==null){localStorage.removeItem(k)}
        else if(!LS.set(k,prev[k])||LS.get(k)!==prev[k])rbBad.push(k);
      }catch(x){rbBad.push(k)}
    });
    bkMsg='還原失敗（'+failed+'）。'+(rbBad.length?'有 '+rbBad.length+' 個儲存區無法自動回復（'+rbBad.join('、')+'），請立刻使用「回復到還原前」或貼上先前複製的備份。':'所有儲存區已回復為還原前的資料，沒有任何改動。');
    bkPrev=null;render();return;
  }
  /* 成功：重新載入記憶體 */
  var err=loadState(LS.get(KEY));
  if(err){bkMsg='還原已寫入，但重新載入時發現格式問題：'+err;render();return}
  loadErr='';rawBad=null;saveBad=false;sess=null;pdfRes=null;pdfInfo=null;pending=null;impReport=null;cat='';exF='';ep=null;imLoad();imPrev=null;imMsg='';
  bkPrev=null;bkIn='';bkNeedForce=false;
  bkMsg='還原完成：'+keys.length+' 個儲存區全部寫入並讀回驗證。'+rowsText(pv.rows)+(pv.keep&&pv.keep.length?'保持不變的儲存區：'+pv.keep.join('、')+'。':'')+(hadErr?'還原前損壞的原始資料已另存為「救援副本」（無法直接還原，只能複製保存）。':'');
  guardUpdate();render();window.scrollTo(0,0);
}

var hm='practice',fY='',fR='',fS='',fC='';
function regMap(){var m={};(S.exams||[]).forEach(function(e){m[e.id]=e});return m}
function metaOf(q,reg){
  var r=reg[examOf(q)];
  if(r)return {year:String(r.year||''),round:String(r.round||''),subject:String(r.subject||'')};
  var p=parseExamCat(q.cat)||{};
  return {year:p.year||'',round:p.round||'',subject:p.subject||''};
}
function passF(q){
  if(!(fY||fR||fS||fC))return true;
  var m=metaOf(q,regMap());
  if(fY==='__none')return !m.year&&(!fC||catOf(q)===fC);
  if(fY&&m.year!==fY)return false;
  if(fR&&m.round!==fR)return false;
  if(fS&&(fS==='__nosub'?m.subject!=='':m.subject!==fS))return false;
  return true;
}
/* 依目前題庫算出各層選項與題數，並把不相容的下層選擇重設為「全部」 */
function hmCalc(B){
  var reg=regMap(),M=B.map(function(q){return metaOf(q,reg)});
  function tally(ok,key){var o={};M.forEach(function(m,i){if(ok(m,i)){var k=key(m,i);o[k]=(o[k]||0)+1}});return o}
  var years=tally(function(m){return !!m.year},function(m){return m.year});
  var none=M.filter(function(m){return !m.year}).length;
  if(fY==='__none'?!none:(fY&&!years[fY]))fY='';
  var rounds={},subs={},cats={};
  if(fY==='__none'){
    fR='';fS='';
    cats=tally(function(m){return !m.year},function(m,i){return catOf(B[i])});
    if(fC&&!cats[fC])fC='';
  }else{
    fC='';
    rounds=tally(function(m){return m.year&&m.round&&(!fY||m.year===fY)},function(m){return m.round});
    if(fR&&!rounds[fR])fR='';
    subs=tally(function(m){return m.year&&(!fY||m.year===fY)&&(!fR||m.round===fR)},function(m){return m.subject||'__nosub'});
    if(fS&&!subs[fS])fS='';
  }
  var num=function(a,b){return a-b};
  return {
    years:Object.keys(years).sort(function(a,b){return b-a}).map(function(k){return [k,k+' 年度（'+years[k]+' 題）']}).concat(none?[['__none','未歸屬考卷（'+none+' 題）']]:[]),
    rounds:Object.keys(rounds).sort(num).map(function(k){return [k,'第 '+k+' 次（'+rounds[k]+' 題）']}),
    subs:Object.keys(subs).sort(function(a,b){return a.localeCompare(b,'zh-TW')}).map(function(k){return [k,(k==='__nosub'?'（未標科目）':k)+'（'+subs[k]+' 題）']}),
    cats:Object.keys(cats).sort(function(a,b){return a.localeCompare(b,'zh-TW')}).map(function(k){return [k,k+'（'+cats[k]+' 題）']}),
    none:none
  };
}

/* ---------- quiz logic ---------- */
function prep(q){
  if(!S.settings.shuffle)return q;
  var idx=shuffle(q.opts.map(function(_,i){return i}));
  return Object.assign({},q,{opts:idx.map(function(i){return q.opts[i]}),ans:idx.indexOf(q.ans)});
}
function start(mode){
  var list=mode==='wrong'?wrongList():pool().slice();
  if(!list.length){toast('沒有可用的題目');return}
  if(mode!=='practice'||S.settings.order==='rand')list=shuffle(list);
  if(mode==='exam'&&S.settings.examN>0)list=list.slice(0,S.settings.examN);
  list=list.map(prep);
  sess={mode:mode,list:list,i:0,sel:list.map(function(){return null}),t0:Date.now(),confirmExit:false};
  go('quiz');
}
function rec(q,good){
  var s=S.stats[q.id]||{c:0,w:0};
  good?s.c++:s.w++;S.stats[q.id]=s;
  if(!good)S.wrong[q.id]=1;else if(sess.mode==='wrong')delete S.wrong[q.id];
  save();
}
function finish(){
  var ok=0,miss=[];
  sess.list.forEach(function(q,i){
    var s=sess.sel[i],good=s===q.ans;
    if(sess.mode==='exam')rec(q,good);
    good?ok++:miss.push({q:q,s:s});
  });
  sess.result={ok:ok,n:sess.list.length,miss:miss,secs:Math.round((Date.now()-sess.t0)/1000)};
  go('result');
}
function wsk(s){return String(s).normalize('NFKC').replace(/\s+/g,'')}
function qkey(q){return wsk(q.q)+'\u0001'+q.opts.map(wsk).sort().join('\u0002')}
function ctext(q){return wsk(q.opts[q.ans])}
function groupMap(list){var g={};list.forEach(function(q){var k=qkey(q);(g[k]=g[k]||[]).push(q)});return g}
function groupStats(list){
  var g=groupMap(list),dg=0,di=0,cg=0,ci=0;
  Object.keys(g).forEach(function(k){
    var a=g[k];if(a.length<2)return;
    dg++;di+=a.length;
    var t={};a.forEach(function(q){t[ctext(q)]=1});
    if(Object.keys(t).length>1){cg++;ci+=a.length}
  });
  return {dupGroups:dg,dupItems:di,confGroups:cg,confItems:ci};
}
var FL={bank:null,len:-1,map:{}};
function flagOf(q){
  var B=bank();
  if(FL.bank!==B||FL.len!==B.length){
    FL.bank=B;FL.len=B.length;FL.map={};
    var g=groupMap(B);
    Object.keys(g).forEach(function(k){
      var a=g[k];if(a.length<2)return;
      var t={};a.forEach(function(x){t[ctext(x)]=1});
      var conf=Object.keys(t).length>1;
      a.forEach(function(x){FL.map[x.id]={dup:true,conf:conf,n:a.length}});
    });
  }
  var r=FL.map[q.id]||null;
  if(q.pend)return {dup:!!(r&&r.dup),conf:true,n:r?r.n:1};
  return r;
}
function plan(items,mode,keep){
  var base=(mode==='replace'||!S.bank)?[]:S.bank.slice();
  if(keep){
    var used={},cnt={};
    base.forEach(function(q){used[q.id]=1});
    items.forEach(function(q){
      var c=Object.assign({},q),want=c.uid||'';
      delete c.uid;
      if(!want){var kk=qkey(q);cnt[kk]=(cnt[kk]||0)+1;want=hash(c.q+'\u0001'+kk)+'-'+cnt[kk]}
      var id=want,n=1;
      while(used[id]){n++;id=want+'~'+n}
      c.id=id;used[id]=1;base.push(c);
    });
    return {list:base,added:items.length,dup:0,conflict:0,gs:groupStats(base)};
  }
  var keys={},ids={},added=0,dup=0,conflict=0;
  base.forEach(function(q){var k=qkey(q);keys[k]=q;ids[q.id]=k});
  items.forEach(function(q){
    var k=qkey(q);
    if(keys[k]){dup++;if(ctext(keys[k])!==ctext(q))conflict++;return}
    var c=Object.assign({},q);
    delete c.uid;
    if(ids[c.id]&&ids[c.id]!==k)c.id=hash(c.q+'\u0001'+k);
    keys[k]=c;ids[c.id]=k;base.push(c);added++;
  });
  return {list:base,added:added,dup:dup,conflict:conflict};
}
function applyImport(r,btn,fromText){
  if(!r.items.length){
    impMsg='沒有可匯入的題目'+(r.skipped?'：'+reasonText(r):'')+'。目前題庫沒有改變。';
    impReport=null;if(!fromText)pending=null;render();return;
  }
  var run=function(){
    var p=plan(r.items,impMode,keepAll);
    S.bank=p.list;
    var ok=save();

var PDF_WORKER='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
var pdfOkOpen=false,pdfDoc=null,pdfInfo=null,pdfRes=null,pdfBusy='';
function pdfReady(){return typeof window.pdfjsLib!=='undefined'&&window.pdfjsLib&&!!window.pdfjsLib.getDocument}
function cjk(c){return !!c&&(c>='　'&&c<='鿿'||c>='＀'&&c<='￯')}
function joinLines(arr){
  var out='';
  arr.forEach(function(s){
    s=String(s).trim();if(!s)return;
    if(!out)out=s;
    else out+=(cjk(out.slice(-1))&&cjk(s.charAt(0))?'':' ')+s;
  });
  return out.replace(/\s+/g,' ').trim();
}
function reflowEssay(arr){
  var out=[];
  arr.forEach(function(s){
    s=String(s).trim();if(!s)return;
    if(!out.length||/^(?:[\(（]\s*\d+\s*[\)）]|[A-Da-d][\.、]|\d+\s*[\.、．])/.test(s))out.push(s);
    else out[out.length-1]+=(cjk(out[out.length-1].slice(-1))&&cjk(s.charAt(0))?'':' ')+s;
  });
  return out.join('\n');
}
function cleanName(n){
  return n.replace(/\.pdf$/i,'').replace(/[【\[（(]\s*解答\s*[】\]）)]/g,'').replace(/試題/g,'').replace(/\s+/g,' ').trim();
}
function loadPdf(file){
  pdfOkOpen=false;pdfRes=null;pdfInfo=null;pdfBusy='';impMsg='';impReport=null;pending=null;
  if(pdfDoc&&pdfDoc.destroy){try{pdfDoc.destroy()}catch(e){}}

  try{pdfjsLib.GlobalWorkerOptions.workerSrc=PDF_WORKER}catch(e){}
  var fr=new FileReader();
  fr.onerror=function(){impMsg='無法讀取檔案，請重新選擇。';render()};
  fr.onload=function(){
    pdfjsLib.getDocument({data:new Uint8Array(fr.result)}).promise.then(function(doc){
      pdfDoc=doc;var nm=cleanName(file.name);
      var pe=parseExamCat(nm)||{};pdfInfo={name:file.name,pages:doc.numPages,cat:nm,src:nm,yr:pe.year||'',rd:pe.round||'',sb:pe.subject||''};
      render();
    },function(err){impMsg='無法開啟這個 PDF：'+(err&&err.message?err.message:'檔案格式不正確')+'。';render()});
  };
  fr.readAsArrayBuffer(file);
}
/* 取出每頁文字，依座標重組成「行」，並記錄頁碼 */
function pdfExtract(doc,onProg){
  var lines=[],chars=0,thin=0,n=doc.numPages;
  function one(p){
    return doc.getPage(p).then(function(pg){return pg.getTextContent()}).then(function(tc){
      var rows=[],cnt=0;
      var hs=tc.items.filter(function(it){return it.str&&it.transform}).map(function(it){return it.height||Math.abs(it.transform[3])||10}).sort(function(a,b){return a-b});
      var tol=Math.max(2,(hs[Math.floor(hs.length/2)]||10)*0.6);
      tc.items.forEach(function(it){
        if(!it.str||!it.transform)return;
        var x=it.transform[4],y=it.transform[5],h=it.height||Math.abs(it.transform[3])||10,r=null;
        for(var i=rows.length-1;i>=0&&i>=rows.length-8;i--){if(Math.abs(rows[i].y-y)<=tol){r=rows[i];break}}
        if(!r){r={y:y,its:[]};rows.push(r)}
        r.its.push({x:x,w:it.width||0,h:h,s:it.str});
      });
      rows.sort(function(a,b){return b.y-a.y});
      rows.forEach(function(r){
        r.its.sort(function(a,b){return a.x-b.x});
        var t='',end=null;
        r.its.forEach(function(it){
          if(end!==null&&it.x-end>it.h*0.25&&!/\s$/.test(t)&&!/^\s/.test(it.s))t+=' ';
          t+=it.s;end=it.x+it.w;
        });
        t=t.replace(/\s+/g,' ').trim();
        if(!t||/^第\s*\d+\s*頁\s*[\/／]\s*共\s*\d+\s*頁$/.test(t))return;
        lines.push({t:t,pg:p});cnt+=t.length;
      });
      chars+=cnt;if(cnt<15)thin++;
    });
  }
  var p=0;
  return new Promise(function(res,rej){
    (function next(){
      if(p>=n){res({lines:lines,chars:chars,pages:n,scanned:(thin>n/2)||chars<20*n/2});return}
      p++;onProg(p,n);
      one(p).then(function(){setTimeout(next,0)},rej);
    })();
  });
}
/* 從「(1)…(2)…(3)…(4)…」拆出題幹與選項 */
function splitOptsPdf(text){
  var MK=/[\(（]\s*([1-8])\s*[\)）]/g,ms=[],m;
  while((m=MK.exec(text)))ms.push({n:+m[1],s:m.index,e:m.index+m[0].length});
  for(var i=ms.length-1;i>=0;i--){
    if(ms[i].n!==1)continue;
    var seq=[ms[i]],want=2;
    for(var j=i+1;j<ms.length;j++){if(ms[j].n===want){seq.push(ms[j]);want++}}
    if(seq.length>=2){
      var stem=text.slice(0,seq[0].s).replace(/\s+/g,' ').trim(),opts=[];
      for(var k=0;k<seq.length;k++)opts.push(text.slice(seq[k].e,k<seq.length-1?seq[k+1].s:text.length).replace(/\s+/g,' ').trim());
      return {stem:stem,opts:opts};
    }
  }
  return {stem:text.replace(/\s+/g,' ').trim(),opts:[]};
}
var P_HDR=/^[一二三四五六七八九十]+\s*[、，.．]\s*/;
var P_START=/^(\d{1,3})\s*[\.．、]\s*(.*)$/;
var P_ANS1=/(?:^|\s)[\[［【]\s*(?:解|答案|解答)\s*[:：]?\s*[\]］】]\s*[:：]?/;
var P_ANS2=/^\s*(?:解答|答案|解)\s*[:：]/;
function findAnsMark(lines){
  for(var i=0;i<lines.length;i++){
    var t=lines[i].t,m=P_ANS1.exec(t)||P_ANS2.exec(t);
    if(m)return {i:i,before:t.slice(0,m.index),after:t.slice(m.index+m[0].length)};
  }
  return null;
}
function parseAns(txt,nopt){
  txt=txt.trim();
  var m=txt.match(/^[\(（]\s*([1-8])\s*[\)）]\s*(.*)$/)||txt.match(/^([1-8])(?:\s+|[\.、．]\s*|$)(.*)$/);
  if(m){var k=+m[1]-1;return {ans:k<nopt?k:null,exp:m[2]||''}}
  m=txt.match(/^[\(（]\s*([A-Ha-h])\s*[\)）]\s*(.*)$/)||txt.match(/^([A-Ha-h])(?:\s+|[\.、．]\s*|$)(.*)$/);
  if(m){var k2='ABCDEFGH'.indexOf(m[1].toUpperCase());return {ans:k2<nopt?k2:null,exp:m[2]||''}}
  return {ans:null,exp:txt};
}
function parseExamLines(lines){
  var items=[],essays=[],mode='mcq',cur=null;
  function finish(c){
    var mk=findAnsMark(c.lines),bl,al=[];
    if(mk){
      bl=c.lines.slice(0,mk.i).map(function(x){return x.t});
      if(mk.before.trim())bl.push(mk.before);
      if(mk.after.trim())al.push(mk.after);
      c.lines.slice(mk.i+1).forEach(function(x){al.push(x.t)});
    }else bl=c.lines.map(function(x){return x.t});
    var pgEnd=c.lines[c.lines.length-1].pg;
    if(c.mode==='essay'){
      var eq=reflowEssay(bl),ea=reflowEssay(al);
      essays.push({no:c.n,pg:c.pg,pgEnd:pgEnd,q:eq,q0:eq,ans:ea,pend:!ea.trim(),sel:true});
      return;
    }
    var sp=splitOptsPdf(joinLines(bl)),it={no:c.n,pg:c.pg,pgEnd:pgEnd,q:sp.stem,opts:sp.opts.slice(),ans:null,exp:'',pend:false,sel:false};
    if(mk){var a=parseAns(joinLines(al),sp.opts.length);it.ans=a.ans;it.exp=a.exp.trim()}
    it.status=(!it.q||it.opts.length<2)?'bad':(it.ans===null?'noans':'ok');
    if(it.status==='bad'){it.q=joinLines(bl);it.opts=[];it.ans=null}
    it.sel=it.status==='ok';
    while(it.opts.length<4)it.opts.push('');
    items.push(it);
  }
  function close(){if(cur){finish(cur);cur=null}}
  lines.forEach(function(L){
    var t=L.t,m;
    if(P_HDR.test(t)&&t.length<90){
      if(/問答|申論|簡答|論述|計算|填充/.test(t)){close();mode='essay';return}
      if(/單選|選擇|是非|測驗/.test(t)){close();mode='mcq';return}
    }
    m=t.match(P_START);
    if(m&&+m[1]===(cur?cur.n+1:1)){close();cur={n:+m[1],mode:mode,pg:L.pg,lines:[{t:m[2],pg:L.pg}]};return}
    if(cur)cur.lines.push(L);
  });
  close();
  return {items:items,essays:essays};
}

    var c=check({id:'pdf-'+hash(src0+'#'+it.no+'#'+it.q.trim()),q:it.q,opts:opts,ans:(it.ans===null?null:it.ans+1),exp:it.exp,cat:cat0,src:src0+' 第'+it.no+'題'});
    if(!c.ok){bad++;reasons[c.err]=(reasons[c.err]||0)+1;return}
    if(ex0){c.ok.ex=ex0;c.ok.no=String(it.no);if(it.pg)c.ok.pg=it.pg}
    if(have[c.ok.uid]){already++;if(ex0)fill.push({id:c.ok.uid||c.ok.id,m:{ex:ex0,no:String(it.no),pg:it.pg}});return}
    if(it.pend)c.ok.pend=true;

  });
  var essaysNew=[],E=S.essays||[],eh={};E.forEach(function(e){eh[e.id]=1});
  R.essays.forEach(function(e){
    if(!e.sel)return;
    var id='es-'+hash(src0+'#'+e.no+'#'+(e.q0||e.q));
    if(eh[id]){if(ex0)fill.push({e:id,m:{ex:ex0,pg:e.pg}});return}eh[id]=1;
    var ym=/(\d{2,3})\s*年/.exec(src0),qq=String(e.q).trim(),aa=String(e.ans).trim();
    if(!qq){bad++;return}
    essaysNew.push({id:id,no:String(e.no),pg:e.pg,q:qq,ans:aa,exp:'',year:ym?ym[1]+'年':'',src:src0,cat:cat0,pend:!!e.pend||!aa,at:Date.now()});
    if(ex0)essaysNew[essaysNew.length-1].ex=ex0;
  });
  if(!items.length&&!essaysNew.length&&!fill.length){
    impMsg='沒有可匯入的題目：'+(sel?'勾選的題目都已匯入過或資料不完整。':'請先勾選要匯入的題目。')+'目前題庫沒有改變。';render();return;
  }
  var run=function(){
    var p=plan(items,impMode,true);
    if(items.length)S.bank=p.list;
    S.essays=E.concat(essaysNew);
    var nfill=0;
    if(fill.length){
      var bm={},em={};(S.bank||[]).forEach(function(q){bm[q.id]=q});S.essays.forEach(function(x){em[x.id]=x});
      fill.forEach(function(f){var o=f.e?em[f.e]:bm[f.id];if(!o)return;var ch=false;
        ['ex','no','pg'].forEach(function(k){if(f.m[k]!=null&&f.m[k]!==''&&(o[k]==null||o[k]==='')){o[k]=f.m[k];ch=true}});
        if(ch)nfill++});
    }
    if(ex0){
      if(!S.exams)S.exams=[];
      var xr=S.exams.filter(function(x){return x.id===ex0})[0];
      if(!xr){xr={id:ex0,year:yr0,round:rd0,subject:sb0,pdfs:[],at:Date.now()};S.exams.push(xr)}
      if(xr.pdfs.indexOf(pdfInfo.name)<0)xr.pdfs.push(pdfInfo.name);
    }
    var ok=save();
    var note=[];
    if(already)note.push('已匯入過而略過 '+already+' 題');
    if(bad)note.push('資料不完整未匯入 '+bad+' 題（'+Object.keys(reasons).map(function(k){return k+' × '+reasons[k]}).join('；')+'）');
    if(essaysNew.length)note.push('申論題 '+essaysNew.length+' 題已加入申論題題庫');
    if(ex0)note.push('歸入考卷：'+examName({year:yr0,round:rd0,subject:sb0}));else note.push('沒有填年度與次數，未建立考卷連結（仍會依分類名稱自動歸類）');
    if(nfill)note.push('補上考卷連結、題號、頁碼 '+nfill+' 題（題目與答案沒有改動）');
    impReport={file:pdfInfo.name,keep:true,total:sel,added:p.added,dup:0,conflict:0,gs:items.length?p.gs:groupStats(bank()),bad:0,detail:'',count:bank().length,saved:ok,note:note.join('；')};
    pdfRes=null;pdfInfo=null;if(pdfDoc&&pdfDoc.destroy){try{pdfDoc.destroy()}catch(e){}}pdfDoc=null;
    impMsg='';cat='';render();window.scrollTo(0,0);
  };
  if(impMode==='replace'&&S.bank&&items.length)twice(btn,'replacepdf',run);else run();
}

function parseExamCat(c){
  c=String(c||'');var m;
  m=/(\d{2,3})\s*年度?\s*第\s*(\d+)\s*次\s*[－\-—:：\s]*(.*)$/.exec(c);
  if(m)return {year:m[1],round:m[2],subject:m[3].trim()};
  m=/^(.*?)(\d{2,3})\s*年\s*[\(（]\s*(\d+)\s*[\)）]\s*(.*)$/.exec(c);
  if(m)return {year:m[2],round:m[3],subject:(m[1]+m[4]).trim()};
  return null;
}
function examId(y,r,s){return 'ex-'+y+'-'+r+'-'+hash(String(s||''))}
function examOf(o){
  if(o&&o.ex)return o.ex;
  var p=parseExamCat(o&&o.cat);
  return p?examId(p.year,p.round,p.subject):'ex-misc';
}
function examName(m){return m.year?(m.year+'年度第'+m.round+'次'+(m.subject?' '+m.subject:'')):'未歸屬考卷'}
function examList(){
  var reg={},map={},order=[];
  (S.exams||[]).forEach(function(e){reg[e.id]=e});
  function get(o){
    var id=examOf(o);
    if(!map[id]){
      var r=reg[id],p=parseExamCat(o.cat)||{};
      var m={id:id,year:r?r.year:(p.year||''),round:r?r.round:(p.round||''),subject:r?r.subject:(p.subject||''),pdfs:(r&&r.pdfs)?r.pdfs.slice():[],mcq:[],ess:[]};
      if(id==='ex-misc'){m.year='';m.round='';m.subject=''}
      m.name=examName(m);map[id]=m;order.push(id);
    }
    return map[id];
  }
  (S.bank||[]).forEach(function(q){get(q).mcq.push(q)});
  (S.essays||[]).forEach(function(e){get(e).ess.push(e)});
  var L=order.map(function(id){return map[id]});
  L.sort(function(a,b){
    if(!a.year!==!b.year)return a.year?-1:1;
    return (b.year-a.year)||(b.round-a.round)||(a.name<b.name?-1:1);
  });
  return L;
}
function examById(id){var L=examList();for(var i=0;i<L.length;i++)if(L[i].id===id)return L[i];return null}
function examSource(m){
  if(m.pdfs.length)return m.pdfs.join('、');
  if(m.mcq.some(function(q){return /^Excel/.test(q.src||'')}))return 'Excel 題庫匯入';
  if(m.mcq.concat(m.ess).some(function(q){return /^(pdf|es)-/.test(q.id||'')}))return 'PDF 匯入（檔名未記錄，重新匯入同一份 PDF 可補上）';
  return '未記錄';
}

    +(e.exp?'<div class="exp"><b>解析</b><span class="pre">'+esc(e.exp)+'</span></div>':'')
    +(e.pend?'<div class="note">這題的參考答案還沒有核對，請對照原始解答。</div>':'')
    +'<div class="setrow"><label>自我評估（選填，不計分）</label><div class="seg"><button data-act="ep-mark" data-v="ok" class="'+(mk==='ok'?'on':'')+'">我掌握了</button><button data-act="ep-mark" data-v="review" class="'+(mk==='review'?'on':'')+'">需要複習</button></div></div>';
  return h+'</div>';
}
function epDock(){

function epAct(a,b){

var esQ='',esEdit=null,esMsg='',esOut='',esBack='';
/* 舊資料（PDF 暫存區）只補欄位，不刪任何原有欄位 */
function normEssay(e){
  e=(e&&typeof e==='object')?e:{};
  var r=Object.assign({},e);
  ['q','ans','exp','year','src','cat'].forEach(function(k){r[k]=(r[k]==null)?'':String(r[k])});
  r.no=(r.no==null)?'':String(r.no);
  r.pend=(e.pend===undefined)?!r.ans.trim():!!e.pend;
  if(!r.year){var m=/(\d{2,3})\s*年/.exec(r.src);r.year=m?m[1]+'年':''}
  r.id=r.id?String(r.id):'es-'+hash(r.src+'#'+r.no+'#'+r.q);
  return r;
}
function essayPendCount(){return (S.essays||[]).filter(function(e){return e.pend}).length}
function essayMatch(e,q){
  q=q.trim().toLowerCase();if(!q)return true;
  return [e.no,e.q,e.ans,e.exp,e.year,e.src,e.cat].join('\n').toLowerCase().indexOf(q)>=0;
}

/* ---- 申論題頁：年度 → 科目 → 考卷 分層篩選（選項全由現有資料產生；年度／科目缺少時歸入未歸屬，不推測）---- */
function esfYK(m){return m.year?String(m.year):'__none'}
function esfSK(m){return m.subject?m.subject:'__nosub'}
function esfModel(){
  var L=examList().filter(function(m){return m.ess.length}),all={};
  examList().forEach(function(m){all[m.id]=m});
  var years=uniq(L.map(esfYK)).sort(function(a,b){return a==='__none'?1:b==='__none'?-1:b-a});
  if(esfY&&years.indexOf(esfY)<0)esfY='';
  var LY=L.filter(function(m){return !esfY||esfYK(m)===esfY});
  var subs=uniq(LY.map(esfSK)).sort(function(a,b){return a==='__nosub'?1:b==='__nosub'?-1:(a<b?-1:1)});
  if(esfS&&subs.indexOf(esfS)<0)esfS='';
  var LX=LY.filter(function(m){return !esfS||esfSK(m)===esfS}).sort(function(a,b){return (b.year-a.year)||(a.round-b.round)||(a.name<b.name?-1:1)});
  if(esEx&&!LX.some(function(m){return m.id===esEx}))esEx='';
  function n(arr){var t=0;arr.forEach(function(m){t+=m.ess.length});return t}
  return {all:all,years:years,subs:subs,exams:LX,
    ny:function(y){return n(L.filter(function(m){return esfYK(m)===y}))},
    ns:function(sv){return n(LY.filter(function(m){return esfSK(m)===sv}))}};
}
function esfActive(){return !!(esfY||esfS||esEx||esQ.trim())}
function essayFiltered(){
  var M=esfModel();
  return (S.essays||[]).filter(function(e){
    var m=M.all[examOf(e)];if(!m)return !esfY&&!esfS&&!esEx&&essayMatch(e,esQ);
    return (!esfY||esfYK(m)===esfY)&&(!esfS||esfSK(m)===esfS)&&(!esEx||m.id===esEx)&&essayMatch(e,esQ);
  });
}
function esfSel(id,label,val,opts,allLabel){
  return '<div class="setrow"><label for="'+id+'">'+label+'</label><select id="'+id+'"><option value="">'+allLabel+'</option>'
    +opts.map(function(o){return '<option value="'+esc(o[0])+'"'+(val===o[0]?' selected':'')+'>'+esc(o[1])+'</option>'}).join('')+'</select></div>';
}
function esfHTML(){
  var M=esfModel();
  var yo=M.years.map(function(y){return [y,(y==='__none'?'未歸屬（無年度）':y+' 年度')+'（'+M.ny(y)+'）']});
  var so=M.subs.map(function(sv){return [sv,(sv==='__nosub'?'（未標科目）':sv)+'（'+M.ns(sv)+'）']});
  var xo=M.exams.map(function(m){
    var p=[];
    if(!m.year)p.push('未歸屬考卷');
    else{if(!esfY)p.push(m.year+' 年度');p.push(m.round?'第 '+m.round+' 次':'（未標次數）')}
    if(!esfS&&m.subject)p.push(m.subject);
    return [m.id,p.join(' ')+'（'+m.ess.length+'）'];
  });
  return esfSel('esfy','年度',esfY,yo,'全部年度')+esfSel('esfs','科目',esfS,so,'全部科目')+esfSel('eex','考卷',esEx,xo,'全部考卷')
    +(esfY||esfS||esEx?'<button class="btn sm" data-act="essay-fclear" style="align-self:flex-start">清除篩選</button>':'');
}
function esPracInner(){

function essayListHTML(){

function essayFormHTML(){

    +'<button class="btn" data-act="essay-export" style="justify-content:center"'+(E.length?'':' disabled')+'>複製申論題備份（'+E.length+' 題）</button>'

    +'<input type="file" id="ef" class="vh" accept=".json,.txt,application/json,text/plain"><label class="btn" for="ef" style="justify-content:center">選擇備份檔還原</label>'
    +'<textarea id="ein" placeholder="或把備份文字貼在這裡" style="min-height:100px">'+esc(esBack)+'</textarea>'

function essayBackupText(){
  return JSON.stringify({format:'exam-bank-essays',version:1,exported:new Date().toISOString(),count:(S.essays||[]).length,essays:S.essays||[],exams:S.exams||[],answers:S.eans||{},marks:S.emark||{}},null,1);
}
function essayRestore(text,label){
  var j,arr,bad=0,add=0,have=0;
  text=String(text||'').trim();
  if(!text){esMsg='沒有內容可還原。';render();return}
  try{j=JSON.parse(text)}catch(e){esMsg='備份格式錯誤：'+e.message+'。現有申論題沒有改變。';render();return}
  arr=Array.isArray(j)?j:(j&&Array.isArray(j.essays)?j.essays:null);
  if(!arr){esMsg='這不是申論題備份（找不到 essays 清單）。現有申論題沒有改變。';render();return}
  var ids={};(S.essays||[]).forEach(function(e){ids[e.id]=1});
  var next=(S.essays||[]).slice();
  arr.forEach(function(raw){
    if(!raw||typeof raw!=='object'||!String(raw.q==null?'':raw.q).trim()){bad++;return}
    var e=normEssay(raw);
    if(ids[e.id]){have++;return}
    ids[e.id]=1;next.push(e);add++;
  });
  var xa=0;
  if(j&&!Array.isArray(j)){
    if(Array.isArray(j.exams)){var xi={};(S.exams||[]).forEach(function(x){xi[x.id]=1});j.exams.forEach(function(x){if(x&&x.id&&!xi[x.id]){S.exams.push(x);xi[x.id]=1}})}
    if(j.answers&&typeof j.answers==='object')Object.keys(j.answers).forEach(function(k){if(!S.eans[k]&&j.answers[k]&&ids[k]){S.eans[k]=j.answers[k];xa++}});
    if(j.marks&&typeof j.marks==='object')Object.keys(j.marks).forEach(function(k){if(!S.emark[k]&&ids[k])S.emark[k]=j.marks[k]});
  }
  S.essays=next;var ok=save();
  esBack='';
  esMsg=(label?label+'：':'')+'讀到 '+arr.length+' 題，新增 '+add+' 題，已存在略過 '+have+' 題，格式錯誤 '+bad+' 題。'+(xa?'還原作答 '+xa+' 筆。':'')+(ok?'':'（瀏覽器沒有允許儲存，關閉頁面後會消失）');
  render();
}
function essaySave(){
  var d=esEdit.data;
  if(!String(d.q).trim()){esMsg='請輸入題目內容。';render();return}
  var out={no:String(d.no).trim(),q:String(d.q).trim(),ans:String(d.ans).trim(),exp:String(d.exp).trim(),year:String(d.year).trim(),src:String(d.src).trim(),pend:!!d.pend,ex:String(d.ex||'')};
  var autoPend=false;
  if(!out.ans&&!out.pend){out.pend=true;autoPend=true}
  if(esEdit.id){
    var i=S.essays.findIndex(function(e){return e.id===esEdit.id});
    if(i<0){esMsg='找不到這題，可能已被刪除。';esEdit=null;render();return}
    S.essays[i]=Object.assign({},S.essays[i],out,{upd:Date.now()});
  }else{
    out.id='em-'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);out.cat='';out.at=Date.now();
    S.essays.push(out);
  }
  var ok=save();
  esEdit=null;esMsg='已儲存。'+(autoPend?'沒有參考答案，已標記為答案待確認。':'')+(ok?'':'（瀏覽器沒有允許儲存，關閉頁面後會消失）');
  render();window.scrollTo(0,0);
}
function essayAct(a,b){
  var id=b.dataset.id;
  if(a==='essay-bk-toggle'){esBkOpen=!esBkOpen;render()}
  else if(a==='essay-fclear'){esfY='';esfS='';esEx='';esQ='';esShow=200;render()}
  else if(a==='essay-more'){esShow+=200;var l2=$('#elist');if(l2)l2.innerHTML=essayListHTML()}
  else if(a==='essay-practice'){var ids=essayFiltered().map(function(e){return e.id});if(!ids.length){toast('沒有符合條件的題目');return}epStart(ids,'essays')}
  else if(a==='essay-new'){esEdit={id:null,data:{no:'',q:'',ans:'',exp:'',year:'',src:'',pend:false,ex:esEx}};render();window.scrollTo(0,0)}
  else if(a==='essay-edit'){
    var e=S.essays.filter(function(x){return x.id===id})[0];if(!e)return;
    esEdit={id:id,data:{no:e.no,q:e.q,ans:e.ans,exp:e.exp,year:e.year,src:e.src,pend:!!e.pend,ex:e.ex||''}};render();window.scrollTo(0,0);
  }
  else if(a==='essay-cancel'){esEdit=null;render();window.scrollTo(0,0)}
  else if(a==='essay-save')essaySave();
  else if(a==='essay-del'){
    twice(b,'esdel-'+id,function(){
      S.essays=S.essays.filter(function(x){return x.id!==id});if(S.eans)delete S.eans[id];if(S.emark)delete S.emark[id];
      var ok=save();esMsg='已刪除 1 題。'+(ok?'':'（瀏覽器沒有允許儲存）');render();
    });
  }
  else if(a==='essay-export'){
    var t=essayBackupText(),done=function(){esOut='';esMsg='已複製 '+S.essays.length+' 題申論題備份。請貼到「備忘錄」或「檔案」App 保存。';render()},
    fail=function(){esOut=t;esMsg='無法自動複製，請長按下方備份文字全選後複製。';render();var x=$('#eout');if(x){x.focus();x.select()}};
    var p=navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(t):Promise.reject();
    p.then(done,fail);
  }
  else if(a==='essay-show'){esOut=essayBackupText();render();var x=$('#eout');if(x){x.focus();x.select()}}
  else if(a==='essay-restore')essayRestore(esBack,'貼上的備份');
}
document.addEventListener('input',function(e){
  var t=e.target;if(!t)return;
  if(t.id==='eq'){esQ=t.value;esShow=200;var l=$('#elist');if(l)l.innerHTML=essayListHTML();var pc=$('#esprac');if(pc)pc.innerHTML=esPracInner();return}
  if(t.id==='ein'){esBack=t.value;return}

});
document.addEventListener('change',function(e){

  if(t.id==='ef'&&t.files&&t.files[0]){
    var f=t.files[0],fr=new FileReader();t.value='';

    fr.onerror=function(){esMsg='無法讀取檔案，請重新選擇。';render()};

  }

});

/* ---------- events ---------- */
document.addEventListener('input',function(e){if(e.target.id==='imp')impText=e.target.value});
document.addEventListener('change',function(e){var t=e.target;if(t&&t.id==='jf'&&t.files&&t.files[0]){var f=t.files[0];onFile(f);t.value=''}});
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  var a=b.dataset.act;
  if(a.indexOf('img-')===0||a.indexOf('im-')===0){imAct(a,b);return}
  if(a.indexOf('pdf-')===0){pdfAct(a,b);return}
  if(a.indexOf('esi-')===0){esiAct(a,b);return}
  if(a.indexOf('essay-')===0){essayAct(a,b);return}
  if(a.indexOf('exam-')===0){examAct(a,b);return}
  if(a.indexOf('hm-')===0){hmAct(a,b);return}
  if(a.indexOf('bk-')===0||a.indexOf('guard-')===0){bkAct(a,b);return}
  if(a.indexOf('ep-')===0){epAct(a,b);return}
  if(a==='imp-toggle'){impOpen=!impOpen;render()}
  else if(a==='tab'){go(b.dataset.v)}
  else if(a==='cat'){cat=(cat===b.dataset.v)?'':b.dataset.v;render()}
  else if(a==='set'){
    var k=b.dataset.key,v=b.dataset.val;
    if(k==='impMode')impMode=v;
    else if(k==='keepAll')keepAll=(v==='1');
    else{S.settings[k]=k==='shuffle'?v==='1':k==='examN'?Number(v):v;save()}
    render();
  }
  else if(a==='start'){start(b.dataset.mode)}
  else if(a==='pick'){
    var i=sess.i,q=sess.list[i],kk=Number(b.dataset.k);
    if(sess.mode!=='exam'){if(sess.sel[i]!==null)return;sess.sel[i]=kk;rec(q,kk===q.ans)}
    else sess.sel[i]=kk;
    render();
  }
  else if(a==='next'){sess.i++;render();window.scrollTo(0,0)}
  else if(a==='prev'){sess.i--;render();window.scrollTo(0,0)}
  else if(a==='finish'){finish()}
  else if(a==='exit'){sess.confirmExit=true;render()}
  else if(a==='exit-no'){sess.confirmExit=false;render()}
  else if(a==='exit-yes'){sess=null;go('home')}
  else if(a==='import'){var r0=parseInput(impText);r0.file='貼上文字';if(r0.fatal){impMsg=r0.fatal;impReport=null;render();return}pending=null;applyImport(r0,b,true)}
  else if(a==='import-file'){applyImport(pending,b,false)}
  else if(a==='import-cancel'){pending=null;impOpen=false;render()}
  else if(a==='dismiss'){impReport=null;render()}
  else if(a==='copy'){
    var txt=window.__prompt||'';
    var p=navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(txt):Promise.reject();
    p.then(function(){toast('已複製')},function(){fallback=txt;render();var f=$('#fb');if(f){f.focus();f.select()}toast('請長按文字選取後複製')});
  }
  else if(a==='confirm'){
    var key=b.dataset.key;
    twice(b,key,function(){
      if(key==='clearwrong'){S.wrong={}}
      else if(key==='resetstats'){S.stats={};S.wrong={}}
      else if(key==='resetbank'){S.bank=null;impMsg=''}
      else if(key==='clearessays'){S.essays=[]}
      save();render();toast('完成');
    });
  }
});
render();
})();
</script>
